name: CI

# zizmor ignore note: the release job only consumes artifacts built by the
# `test` job in this same run, never a cache populated by an earlier/forked
# run, so opting setup-python into pip caching here is not exploitable.
on: # zizmor: ignore[cache-poisoning]
  pull_request:
  push:
    tags:
    - '*'
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
    - name: Run pre-commit
      run: |
        pip install --upgrade pip pre-commit
        pre-commit run --all-files --show-diff-on-failure
      env:
        # no-commit-to-branch only makes sense as a local git hook, so skip in CI
        SKIP: no-commit-to-branch

  test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install . --group dev
    - name: Run tests
      run: pytest -v
    # Pure-Python package: every matrix leg would build an identical wheel, so
    # only build/upload once (on the newest Python) to avoid duplicate
    # dist-artifacts uploads colliding.
    - name: Build wheel and sdist
      if: matrix.python-version == '3.14'
      run: |
        pip install build
        python -m build
    - name: Upload build artifacts
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@v7
      with:
        name: dist-artifacts
        path: dist/

  release:
    name: Release
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [lint, test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write  # this permission is mandatory for trusted publishing
      contents: write  # required to create a release
    steps:
    - uses: actions/download-artifact@v8
    - name: Flatten directory structure
      run: |
        mkdir -p dist/
        find . -name '*.whl' -exec mv {} dist/ \;
        find . -name '*.tar.gz' -exec mv {} dist/ \;
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        verbose: true
    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        generate_release_notes: true
        files: |
          ./**/*.whl
